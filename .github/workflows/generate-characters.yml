name: 캐릭터 설정화 생성

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_characters.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설정화 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_characters.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters checks/character_gen.md
          git diff --cached --quiet || git commit -m "캐릭터 설정화 생성 [skip ci]"
          git pull --rebase
          git push
