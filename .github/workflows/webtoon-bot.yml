name: 연재 봇

on:
  schedule:
    # GitHub 예약 실행은 정각에 늦거나 빠질 수 있어서 여러 번 시도한다 (중복 실행돼도 안전).
    - cron: "7 3 * * *"    # 12:07 KST — 다음 회차 생성
    - cron: "37 3 * * *"   # 12:37 KST — 생성 재시도 (이미 있으면 건너뜀)
    - cron: "13 11 * * *"  # 20:13 KST — 게시 준비, 20:50까지 기다렸다 게시
    - cron: "31 11 * * *"  # 20:31 KST — 위 실행이 빠졌을 때 대비 (20:50까지 대기)
    - cron: "3 12 * * *"   # 21:03 KST — 그래도 안 올라갔으면 바로 게시
    - cron: "23 12 * * *"  # 21:23 KST — 마지막 재시도
    - cron: "17 0 1 * *"   # 매월 1일 — 인스타 토큰 갱신
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: "generate / publish / refresh"
        required: true
        default: generate
  push:
    paths:
      - "config/trigger.json"   # 수동 실행용: {"action": "generate"}

permissions:
  contents: write
  issues: write

concurrency:
  group: webtoon-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-24.04
    # 다른 사람이 단 댓글이나 PR 댓글에는 반응하지 않음
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 실행할 작업 결정
        id: act
        run: |
          case "${{ github.event_name }}" in
            schedule)
              case "${{ github.event.schedule }}" in
                "7 3 * * *"|"37 3 * * *") a=generate ;;
                "17 0 1 * *")             a=refresh ;;
                *)                        a=publish ;;
              esac ;;
            issue_comment)     a=command ;;
            workflow_dispatch) a="${{ github.event.inputs.action }}" ;;
            push)              a=$(python -c "import json;print(json.load(open('config/trigger.json'))['action'])") ;;
          esac
          echo "action=$a" >> "$GITHUB_OUTPUT"
          echo "작업: $a"

      - name: 의존성 설치
        run: |
          pip install -q pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          mkdir -p fonts
          url=$(python -c "import json;print(json.load(open('config/series.json')).get('font_url',''))")
          [ -n "$url" ] && curl -fsSL -o fonts/hand.ttf "$url" || echo "손글씨 폰트 없음 — 기본 폰트 사용"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 음성·영상 도구 캐시
        if: contains(fromJSON('["publish","publish_now","reel_test","command"]'), steps.act.outputs.action)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: tts-kokoro-v1

      - name: 음성·영상 도구 설치 (Kokoro TTS, ffmpeg)
        if: contains(fromJSON('["publish","publish_now","reel_test","command"]'), steps.act.outputs.action)
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile numpy

      - name: 봇 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          WAIT_UNTIL_9PM: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python scripts/webtoon_bot.py ${{ steps.act.outputs.action }}
