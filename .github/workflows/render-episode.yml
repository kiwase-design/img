name: 회차 렌더링

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "회차 폴더 (예: episodes/ep001)"
        required: true
  push:
    paths:
      - "episodes/*/script.json"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치 (Pillow, 한글 폰트)
        run: |
          pip install pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 렌더링할 회차 찾기
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            echo "dirs=${{ github.event.inputs.episode }}" >> "$GITHUB_OUTPUT"
          else
            dirs=$(git diff --name-only HEAD~1 HEAD -- 'episodes/*/script.json' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          fi

      - name: 그림 생성 + 말풍선 합성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for d in ${{ steps.ep.outputs.dirs }}; do
            python scripts/render_episode.py "$d"
          done

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes
          git diff --cached --quiet || git commit -m "회차 렌더링 결과 [skip ci]"
          git pull --rebase
          git push
